spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.openai.autoconfigure.OpenAiAutoConfiguration

  application:
    name: gitchat

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: Ov23liUhAnrB1KGJ38tF
            client-secret: aaa1e3d5845bae925d630d22426a440effa9fe86
            scope:
              - read:user
              - user:email
              - repo
            user-name-attribute: id

  datasource:
    url: jdbc:postgresql://localhost:5433/devpilot
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:SASKDK239231NMKLE21}
      chat:
        model: gpt-4o-mini
      embedding:
        model: text-embedding-3-small

    # --- PGVECTOR CONFIGURATION ---
    vectorstore:
      pgvector:
        dimensions: 1536
        distance-type: COSINE
        index-type: HNSW
        initialize-schema: true

server:
  servlet:
    session:
      cookie:
        name: DEVPILOT_SESSION
        http-only: true
        same-site: lax
      timeout: 7d

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  token-encryptor-password: ${TOKEN_ENCRYPTOR_PASSWORD:devpilot-local-encrypt-key-change-me}
  token-encryptor-salt: ${TOKEN_ENCRYPTOR_SALT:deadbeefcafebabe}
  indexing:
    max-file-bytes: 102400
    chunk-size: 800
    chunk-overlap: 100
  github:
    api-delay-ms: 50